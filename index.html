<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Uber Moto Particular | Moto Entrega Rápida</title>
  
  <link rel="icon" type="image/png" href="imagens/icone-moto.png">

  <meta name="description" content="Moto entrega rápida, segura e confiável. Solicite sua entrega pelo WhatsApp." />
  <meta name="author" content="Uber Moto Particular" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <main class="bio-page">

    <section class="hero-card">

      <div class="hero-glow"></div>

      <div class="brand-area">
        <div class="brand-icon">
          <i class="fa-solid fa-motorcycle"></i>
        </div>

        <div>
          <span class="brand-label">Moto Entrega Premium</span>
          <h1>Uber Moto Particular</h1>
        </div>
      </div>

      <div class="profile-box">
        <div class="profile-avatar">
            <img
                src="imagens/cliente.png"
                alt="Foto do cliente"
                class="profile-image"
            >
            </div>

        <p class="profile-tag">
          Entregas rápidas, seguras e confiáveis para sua rotina.
        </p>
      </div>

      <div class="action-list">
        <a
          href="https://wa.me/5519995576072"
          target="_blank"
          rel="noopener noreferrer"
          class="action-btn whatsapp-btn"
          aria-label="Chamar no WhatsApp"
        >
          <span>
            <i class="fa-brands fa-whatsapp"></i>
            Chamar no WhatsApp
          </span>
          <i class="fa-solid fa-arrow-right"></i>
        </a>

        <a
          href="https://wa.me/5519995576072?text=Olá,%20gostaria%20de%20solicitar%20uma%20moto%20entrega."
          target="_blank"
          rel="noopener noreferrer"
          class="action-btn primary-btn"
          aria-label="Solicitar moto entrega"
        >
          <span>
            <i class="fa-solid fa-box"></i>
            Solicitar entrega
          </span>
          <i class="fa-solid fa-arrow-right"></i>
        </a>

        <a
          href="https://www.instagram.com/rodrigow_01"
          target="_blank"
          rel="noopener noreferrer"
          class="action-btn instagram-btn"
          aria-label="Abrir Instagram"
        >
          <span>
            <i class="fa-brands fa-instagram"></i>
            Instagram
          </span>
          <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>

      <div class="trust-grid">
        <div class="trust-item">
          <i class="fa-solid fa-bolt"></i>
          <span>Rápido</span>
        </div>

        <div class="trust-item">
          <i class="fa-solid fa-shield-halved"></i>
          <span>Seguro</span>
        </div>

        <div class="trust-item">
          <i class="fa-solid fa-clock"></i>
          <span>Confiável</span>
        </div>
      </div>

      <footer class="bio-footer">
        <p>Atendimento via WhatsApp</p>
        <small>© 2026 Uber Moto Particular</small>
      </footer>

    </section>

  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JS -->
  <script src="js/script.js"></script>
</body>
</html>
